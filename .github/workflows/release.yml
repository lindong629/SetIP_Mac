name: Build Releases

on:
  push:
    tags: ['v*']          # 推送 v 开头的 tag 即构建并发布 Release
  workflow_dispatch: {}   # 允许手动触发（只构建，不发布）

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml pyinstaller

      - name: Build EXE
        working-directory: windows
        run: pyinstaller --onefile --name SetIP --clean -y setip_windows.py

      - name: Package
        working-directory: windows
        shell: pwsh
        run: |
          copy config.yaml dist\config.yaml
          Compress-Archive -Path dist\SetIP.exe, dist\config.yaml -DestinationPath SetIP-windows.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SetIP-windows
          path: windows/SetIP-windows.zip

  build-macos:
    runs-on: macos-latest      # Apple Silicon（macos-14 镜像已退役，会直接被取消）
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml pyinstaller

      - name: Build binary
        run: pyinstaller --onefile --name SetIP --icon icon.icns --clean -y main.py

      - name: Assemble SetIP.app
        run: |
          mkdir -p SetIP.app/Contents/MacOS SetIP.app/Contents/Resources
          cp dist/SetIP SetIP.app/Contents/MacOS/SetIP-bin
          cp icon.icns SetIP.app/Contents/Resources/icon.icns
          cp mac/Info.plist SetIP.app/Contents/Info.plist
          cp mac/launcher SetIP.app/Contents/MacOS/SetIP
          cp mac/setip.command SetIP.app/Contents/MacOS/setip.command
          chmod +x SetIP.app/Contents/MacOS/SetIP \
                   SetIP.app/Contents/MacOS/SetIP-bin \
                   SetIP.app/Contents/MacOS/setip.command
          codesign --force --deep --sign - SetIP.app

      - name: Package
        run: zip -r -y SetIP-macOS.zip SetIP.app config.yaml

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SetIP-macos
          path: SetIP-macOS.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows package
        uses: actions/download-artifact@v4
        with:
          name: SetIP-windows
          path: release

      - name: Download macOS package
        uses: actions/download-artifact@v4
        with:
          name: SetIP-macos
          path: release

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/SetIP-windows.zip
            release/SetIP-macOS.zip
          name: SetIP ${{ github.ref_name }}
          generate_release_notes: true
