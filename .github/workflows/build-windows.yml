name: Build Windows EXE

on:
  workflow_dispatch: {}          # 允许在 Actions 页面手动触发
  push:
    branches: [ master, main ]
    paths:
      - 'windows/**'
      - '.github/workflows/build-windows.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml pyinstaller

      - name: Build EXE
        working-directory: windows
        run: pyinstaller --onefile --name SetIP --clean -y setip_windows.py

      - name: Copy config next to EXE
        working-directory: windows
        run: copy config.yaml dist\config.yaml

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SetIP-windows
          path: |
            windows/dist/SetIP.exe
            windows/dist/config.yaml
          if-no-files-found: error
